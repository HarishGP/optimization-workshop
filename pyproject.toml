[project]
name = "optimization-workshop"
version = "0.1.0"
description = "Illustrate optimization algorithms to undergrads in a 2 hour workshop."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "matplotlib>=3.10.8",
    "torch>=2.11.0",
    "ipykernel>=7.2.0",
    "notebook>=7.0",
    "ipywidgets>=8.1.8",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]